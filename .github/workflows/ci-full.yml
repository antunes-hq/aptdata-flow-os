name: CI — Full Suite + Coverage

on:
  push:
    branches: ["main", "copilot/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync

      - name: Run ruff check
        run: uv run ruff check aptdata/ tests/

  test-full:
    name: Full test suite + coverage (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: lint
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Sync dependencies (with optional extras)
        run: uv sync --extra pandas --extra plugins

      - name: Run full test suite
        run: |
          uv run pytest tests/ \
            -v \
            --cov=aptdata \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=73

      - name: Upload coverage XML
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-full
          path: coverage.xml
