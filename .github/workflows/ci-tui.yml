name: CI — TUI

on:
  push:
    branches: ["main", "copilot/**"]
    paths:
      - "aptdata/tui/**"
      - "tests/test_tui.py"
      - "tests/conftest.py"
  pull_request:
    branches: ["main"]
    paths:
      - "aptdata/tui/**"
      - "tests/test_tui.py"
      - "tests/conftest.py"
  workflow_dispatch:

jobs:
  test-tui:
    name: TUI tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync

      - name: Run TUI tests
        run: |
          uv run pytest \
            tests/test_tui.py \
            -v \
            --cov=aptdata/tui \
            --cov-report=term-missing \
            --cov-fail-under=80

      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-tui
          path: .coverage
