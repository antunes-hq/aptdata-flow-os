name: CI — Core

on:
  push:
    branches: ["main", "copilot/**"]
    paths:
      - "aptdata/core/**"
      - "aptdata/config/**"
      - "tests/test_core.py"
      - "tests/test_config.py"
      - "tests/test_context.py"
      - "tests/test_workflow.py"
      - "tests/test_system.py"
      - "tests/test_lineage.py"
      - "tests/test_secrets.py"
      - "tests/conftest.py"
  pull_request:
    branches: ["main"]
    paths:
      - "aptdata/core/**"
      - "aptdata/config/**"
      - "tests/test_core.py"
      - "tests/test_config.py"
      - "tests/test_context.py"
      - "tests/test_workflow.py"
      - "tests/test_system.py"
      - "tests/test_lineage.py"
      - "tests/test_secrets.py"
      - "tests/conftest.py"
  workflow_dispatch:

jobs:
  test-core:
    name: Core tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync

      - name: Run core tests
        run: |
          uv run pytest \
            tests/test_core.py \
            tests/test_config.py \
            tests/test_context.py \
            tests/test_workflow.py \
            tests/test_system.py \
            tests/test_lineage.py \
            tests/test_secrets.py \
            tests/core/test_declarative_api.py \
            -v \
            --cov=aptdata/core \
            --cov=aptdata/config \
            --cov-report=term-missing \
            --cov-fail-under=74

      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-core
          path: .coverage
