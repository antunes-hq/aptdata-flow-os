name: PR Code Review & Hygiene

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  pr-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Poetry
        uses: snok/install-poetry@v1

      - name: Install Dependencies
        run: poetry install

      - name: Run Code Hygiene Check
        id: code-hygiene
        run: |
          # Capture output of linting
          REPORT=$(poetry run aptdata mesh lint --deep --json || true)

          # Write report to a file so we can read it easily in the next step
          echo "$REPORT" > report.json

          # We don't fail the build here, we let the PR comment show warnings
          echo "Hygiene report generated."

      - name: Post PR Comment
        uses: actions/github-script@v7
        if: always()
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('report.json', 'utf8'));

            let body = "## 🛡️ QA & DX Agent Report\n\n";
            body += `**Status:** ${report.summary.status.toUpperCase()}\n`;
            body += `**Warnings:** ${report.summary.warnings}\n`;
            body += `**Errors:** ${report.summary.errors}\n\n`;

            body += "<details><summary>Detailed Report</summary>\n\n```json\n";
            body += JSON.stringify(report.checks, null, 2);
            body += "\n```\n</details>";

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Run Ruff Auto-Fix (Corrective PR)
        if: always()
        run: poetry run ruff check --fix .

      - name: Create Corrective PR
        uses: peter-evans/create-pull-request@v6
        if: always()
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: auto-format and docstring fixes"
          title: "🤖 Auto-fix: QA & DX formatting and docstrings"
          body: |
            This is an automated PR generated by the QA & DX Agent.
            It contains auto-fixes from \`ruff\` (formatting, missing docstrings rules, etc).
          branch: "qa-fixes-${{ github.head_ref }}"
          base: ${{ github.head_ref }}

      - name: Enforce Architecture Rules
        if: always()
        run: |
          STATUS=$(jq -r '.summary.status' report.json)
          if [ "$STATUS" = "failed" ]; then
            echo "::error::Architectural rules violated. PR blocked."
            exit 1
          fi
