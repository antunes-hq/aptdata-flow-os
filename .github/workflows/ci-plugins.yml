name: CI — Plugins

on:
  push:
    branches: ["main", "copilot/**"]
    paths:
      - "aptdata/plugins/**"
      - "aptdata/mcp/**"
      - "aptdata/telemetry/**"
      - "tests/test_plugins.py"
      - "tests/test_quality.py"
      - "tests/test_transform.py"
      - "tests/test_governance.py"
      - "tests/test_mcp.py"
      - "tests/test_rag_ingestion.py"
      - "tests/test_telemetry_instrumentation.py"
      - "tests/conftest.py"
  pull_request:
    branches: ["main"]
    paths:
      - "aptdata/plugins/**"
      - "aptdata/mcp/**"
      - "aptdata/telemetry/**"
      - "tests/test_plugins.py"
      - "tests/test_quality.py"
      - "tests/test_transform.py"
      - "tests/test_governance.py"
      - "tests/test_mcp.py"
      - "tests/test_rag_ingestion.py"
      - "tests/test_telemetry_instrumentation.py"
      - "tests/conftest.py"
  workflow_dispatch:

jobs:
  test-plugins:
    name: Plugin tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Sync dependencies (with plugin extras)
        run: uv sync --extra pandas --extra plugins

      - name: Run plugin tests
        run: |
          uv run pytest \
            tests/test_plugins.py \
            tests/test_quality.py \
            tests/test_transform.py \
            tests/test_governance.py \
            tests/test_mcp.py \
            tests/test_rag_ingestion.py \
            tests/test_telemetry_instrumentation.py \
            -v \
            --cov=aptdata/plugins \
            --cov=aptdata/mcp \
            --cov=aptdata/telemetry \
            --cov-report=term-missing \
            --cov-fail-under=70

      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-plugins
          path: .coverage
