name: CI — Integration & E2E

on:
  push:
    branches: ["main", "copilot/**"]
    paths:
      - "aptdata/**"
      - "tests/test_integration.py"
      - "tests/test_e2e.py"
      - "tests/conftest.py"
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test-integration:
    name: Integration tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Sync dependencies (with optional extras)
        run: uv sync --extra pandas --extra plugins

      - name: Run integration tests
        run: |
          uv run pytest \
            tests/test_integration.py \
            -v \
            -m integration \
            --tb=short

  test-e2e:
    name: E2E tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync

      - name: Run E2E tests
        run: |
          uv run pytest \
            tests/test_e2e.py \
            -v \
            -m e2e \
            --tb=short
