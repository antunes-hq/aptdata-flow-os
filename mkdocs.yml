site_name: smart-data
site_description: A declarative framework for building smart data pipelines
site_url: https://strondata.github.io/smart-data
repo_url: https://github.com/strondata/smart-data
repo_name: strondata/smart-data
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - toc.integrate
    - content.code.copy
    - content.code.annotate

  icon:
    repo: fontawesome/brands/github

extra_javascript:
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js

plugins:
  - search
  - autorefs:
      link_titles: auto
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            show_category_heading: true
            members_order: source
            docstring_style: numpy

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Architecture: architecture.md
  - Engines: transform-engines.md
  - Quality: quality.md
  - Governance: governance.md
  - Scaffold Templates: scaffold-templates.md
  - Telemetry: telemetry.md
  - MCP Server: mcp.md
  - Configuration: configuration.md
  - API Reference:
      - Core: api/core.md
      - CLI: api/cli.md
      - CLI Interactive: api/cli-interactive.md
      - Plugins: api/plugins.md
  - Changelog: changelog.md
  - AI Docs:
      - llms.txt: llms.txt
      - llms-full.txt: llms-full.txt

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
