[tool.poetry]
name = "smart-data"
version = "0.0.1"
description = "A framework for smart data pipelines"
authors = ["strondata"]
readme = "README.md"
packages = [{include = "smart_data"}]

[tool.poetry.dependencies]
python = "^3.10"
pydantic = "^2.0"
typer = {extras = ["all"], version = "^0.15"}
rich = "^13.0"
textual = "^0.60"
pyyaml = "^6.0"
opentelemetry-api = "^1.40.0"
opentelemetry-sdk = "^1.40.0"
mcp = "^1.26.0"

[tool.poetry.group.plugins.dependencies]
httpx = {version = "^0.27", optional = true}
sqlalchemy = {version = "^2.0", optional = true}
psycopg2-binary = {version = "^2.9", optional = true}
pyarrow = {version = "^15.0", optional = true}

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-cov = "^5.0"
ruff = "^0.4"
mkdocs = "^1.6"
mkdocs-material = "^9.5"
mkdocstrings = {extras = ["python"], version = "^0.25"}
pytest-asyncio = "^1.3.0"

[tool.poetry.scripts]
smart-data = "smart_data.cli.app:app"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
