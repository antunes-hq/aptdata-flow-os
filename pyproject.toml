[project]
name = "aptdata"
version = "0.2.0"
description = "A declarative, extensible framework for building smart data pipelines in Python"
authors = [{ name = "strondata" }]
license = "MIT"
readme = "README.md"
keywords = ["data-pipeline", "framework", "etl", "pydantic", "data-engineering"]
requires-python = ">=3.10,<4.0"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "pydantic>=2.0,<3.0",
    "typer>=0.15,<0.16",
    "rich>=13.0,<14.0",
    "textual>=0.60,<0.61",
    "pyyaml>=6.0,<7.0",
    "opentelemetry-api>=1.40.0,<2.0.0",
    "opentelemetry-sdk>=1.40.0,<2.0.0",
    "python-dotenv>=1.0,<2.0",
    "questionary>=2.0",
]

[project.urls]
Homepage = "https://strondata.github.io/smart-data"
Repository = "https://github.com/strondata/smart-data"
Documentation = "https://strondata.github.io/smart-data"

[project.optional-dependencies]
pandas = ["pandas>=2.2,<3.0"]
spark = ["pyspark>=3.5,<4.0"]
plugins = [
    "httpx>=0.27,<0.28",
    "sqlalchemy>=2.0,<3.0",
    "psycopg2-binary>=2.9,<3.0",
    "pyarrow>=15.0,<16.0",
]
ai = ["mcp>=1.26.0,<2.0.0"]
all = [
    "pandas>=2.2,<3.0",
    "pyspark>=3.5,<4.0",
    "httpx>=0.27,<0.28",
    "sqlalchemy>=2.0,<3.0",
    "psycopg2-binary>=2.9,<3.0",
    "pyarrow>=15.0,<16.0",
    "mcp>=1.26.0,<2.0.0",
]

[project.scripts]
aptdata = "aptdata.cli.app:app"

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<6.0",
    "pytest-asyncio>=1.3.0,<2.0.0",
    "ruff>=0.4,<0.5",
    "mypy>=1.10,<2.0",
    "pre-commit>=3.7,<4.0",
    "check-jsonschema>=0.28,<0.29",
    "mkdocs>=1.6,<2.0",
    "mkdocs-material>=9.5,<10.0",
    "mkdocstrings[python]>=0.25,<0.26",
    "bump-my-version>=0.20.0,<0.21.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aptdata"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.coverage.run]
source = ["aptdata"]
omit = [
    "aptdata/plugins/transform/spark.py",
    "aptdata/plugins/transform/pandas.py",
    "aptdata/plugins/postgres.py",
    "aptdata/mcp/server.py",
]

[tool.coverage.report]
fail_under = 73
show_missing = true

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

# mypy leniente por ora — o código ainda não é 100% anotado; apertar é
# incremental (os contratos Pydantic pagam type-check à medida que anotamos).
[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = false
exclude = ["tests/", "aptdata/viz/static/"]
